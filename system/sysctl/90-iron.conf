# Iron Linux Ingot defaults. Swap is compressed RAM (zram), so swapping is cheap
# and readahead from it is pointless.
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
# Agent Desktops run many processes/containers; raise inotify limits for IDE-style agents.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
