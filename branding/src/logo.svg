<?xml version="1.0" encoding="UTF-8"?>
<!-- Iron Linux Ingot mark: a cast ingot seen from three-quarter view.
     Original artwork, CC BY-SA 4.0, Iron Linux project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#9aa8b8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6f82"/>
      <stop offset="1" stop-color="#2a333e"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e5bd0"/>
      <stop offset="1" stop-color="#123a8a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- top face (narrower: an ingot tapers upward) -->
  <path d="M70 92 L170 72 L214 98 L114 118 Z" fill="url(#top)"/>
  <!-- front face -->
  <path d="M114 118 L214 98 L230 166 L110 192 Z" fill="url(#front)"/>
  <!-- left end face, cobalt -->
  <path d="M70 92 L114 118 L110 192 L42 152 Z" fill="url(#side)"/>
  <!-- forge highlight along the leading top edge -->
  <path d="M114 118 L214 98" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
</svg>
