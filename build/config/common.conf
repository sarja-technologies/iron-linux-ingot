# shellcheck shell=bash
# Iron Linux Ingot - build configuration (single source of truth).

INGOT_NAME="Iron Linux"
INGOT_EDITION="Ingot"
INGOT_VERSION="${INGOT_VERSION:-26.10-dev}"
INGOT_CODENAME="ingot"

# Upstream base. Ingot tracks the Ubuntu LTS so GNOME/kernel security updates flow
# directly from Ubuntu's signed archives.
INGOT_UBUNTU_SUITE="resolute"
INGOT_UBUNTU_VERSION="26.04"
INGOT_COMPONENTS="main restricted universe multiverse"

INGOT_MIRROR_AMD64="${INGOT_MIRROR_AMD64:-http://archive.ubuntu.com/ubuntu}"
INGOT_MIRROR_ARM64="${INGOT_MIRROR_ARM64:-http://ports.ubuntu.com/ubuntu-ports}"

# Reproducibility: set INGOT_SNAPSHOT=YYYYMMDDTHHMMSSZ to build against
# snapshot.ubuntu.com instead of the live archive (pins every package version).
INGOT_SNAPSHOT="${INGOT_SNAPSHOT:-}"

# Build workspace (root-owned, large). Kept outside git via .gitignore.
INGOT_WORKDIR="${INGOT_WORKDIR:-${INGOT_ROOT}/.work}"
