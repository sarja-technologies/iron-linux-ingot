# Iron Linux Ingot installer (Calamares). Module configs not listed under
# modules/ here come from Ubuntu's maintained calamares-settings-ubuntu-common-data.
---
modules-search: [ local ]

instances:
- id: edition
  module: packagechooser
  config: packagechooser_edition.conf
- id: agents
  module: packagechooser
  config: packagechooser_agents.conf
- id: drivers
  module: packagechooser
  config: packagechooser_drivers.conf
- id: choices
  module: contextualprocess
  config: contextualprocess_choices.conf
- id: iron_postinstall
  module: shellprocess
  config: shellprocess_iron_postinstall.conf
- id: grubfix
  module: shellprocess
  config: shellprocess_iron_grubfix.conf
- id: logs
  module: shellprocess
  config: shellprocess_iron_logs.conf
# Ingot variants of modules whose default configs belong to Ubuntu's
# calamares-settings-ubuntu-common-data (never overwritten).
- id: iron
  module: bootloader
  config: bootloader_iron.conf
- id: iron
  module: finished
  config: finished_iron.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@edition
  - packagechooser@agents
  - packagechooser@drivers
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - contextualprocess@choices
  - shellprocess@iron_postinstall
  - initramfscfg
  - initramfs
  - grubcfg
  - shellprocess@grubfix
  - bootloader@iron
  - shellprocess@logs
  - umount
- show:
  - finished@iron

branding: iron
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
