---
# Signed shim/GRUB from Ubuntu: Secure Boot works out of the box. The EFI
# directory must be "ubuntu" because Canonical-signed GRUB reads its config there.
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "3"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "ubuntu"
installEFIFallback: true
