---
# Record the Ingot choices in the target; iron-installer postinstall applies them.
dontChroot: false
timeout: 30
packagechooser_edition:
    full: "sh -c 'mkdir -p /var/lib/iron-installer && echo full > /var/lib/iron-installer/edition'"
    lite: "sh -c 'mkdir -p /var/lib/iron-installer && echo lite > /var/lib/iron-installer/edition'"
packagechooser_agents:
    "on": "sh -c 'mkdir -p /var/lib/iron-installer && echo on > /var/lib/iron-installer/agents'"
    "off": "sh -c 'mkdir -p /var/lib/iron-installer && echo off > /var/lib/iron-installer/agents'"
packagechooser_drivers:
    auto: "sh -c 'mkdir -p /var/lib/iron-installer && echo auto > /var/lib/iron-installer/drivers'"
    open: "sh -c 'mkdir -p /var/lib/iron-installer && echo open > /var/lib/iron-installer/drivers'"
