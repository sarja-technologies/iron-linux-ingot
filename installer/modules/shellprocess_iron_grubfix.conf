---
# grubcfg adds Arch-style "cryptdevice=UUID=…:name root=/dev/mapper/name" when
# dracut is absent. Ubuntu's initramfs-tools unlocks from /etc/crypttab and
# grub-mkconfig sets root= itself, so drop both before the bootloader runs.
# Runs in the live system (the installer package is already purged from the
# target by then) against the target's root mount point.
dontChroot: true
timeout: 60
script:
    - command: "/usr/libexec/iron-installer/grub-defaults-fix ${ROOT}"
      timeout: 60
