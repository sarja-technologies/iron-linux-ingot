---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false
requirements:
    requiredStorage: 16
    requiredRam: 2.0
    # Calamares only counts a reply *with a body* as connected, so Ubuntu's
    # connectivity-check (HTTP 204, empty) always looked offline. These are
    # small signed archive files: the first serves amd64, the second arm64.
    internetCheckUrl:
        - http://archive.ubuntu.com/ubuntu/dists/resolute/Release.gpg
        - http://ports.ubuntu.com/ubuntu-ports/dists/resolute/Release.gpg
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
