---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    - name: kvm
      must_exist: false
      system: true
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, agent, iron-agent-vm ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "iron-${cpu}"
