name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Also build the amd64 ISO (slow, ~40 min)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            make shellcheck python3 python3-gi python3-pil gjs libglib2.0-bin libxml2-utils ca-certificates \
            gpg gpgv gpg-agent apt-utils dpkg-dev
      - run: make check

  shell:
    name: GNOME Shell 50 integration (headless)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Shell
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            gnome-shell dbus dbus-x11 gir1.2-gtk-4.0 python3-gi libglib2.0-bin \
            gnome-settings-daemon xdg-desktop-portal-gnome mesa-vulkan-drivers libgl1-mesa-dri
      - name: Tiling integration tests
        run: tests/shell/run-shell-tests.sh "$PWD/shell-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-results
          path: shell-results/

  packages:
    name: Build Ingot packages
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends build-essential devscripts equivs
          mk-build-deps -i -r -t "apt-get -y -q --no-install-recommends" debian/control
          # No production archive key is committed yet: CI packages trust a
          # throwaway key, so these artifacts are for testing only.
          if ! ls packaging/archive-keys/*.gpg >/dev/null 2>&1; then
            apt-get install -y -q --no-install-recommends gpg gpg-agent
            export GNUPGHOME="$(mktemp -d)"
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "Iron CI throwaway" ed25519 sign 1d
            gpg --batch --export > packaging/archive-keys/zz-ci-throwaway.gpg
          fi
          dpkg-buildpackage -b -us -uc
          mkdir -p debs && mv ../*.deb debs/
      - uses: actions/upload-artifact@v4
        with:
          name: ingot-debs
          path: debs/*.deb

  iso:
    name: Build amd64 ISO
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q debootstrap squashfs-tools xorriso mtools dosfstools gnupg apt-utils
          # Older runner images may lack the resolute debootstrap script.
          [ -e /usr/share/debootstrap/scripts/resolute ] || sudo ln -s gutsy /usr/share/debootstrap/scripts/resolute
      - name: Build
        run: sudo INGOT_WORKDIR=/mnt/ingot build/ingot-build --arch amd64 --profile full
      - uses: actions/upload-artifact@v4
        with:
          name: iron-ingot-amd64-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.manifest
