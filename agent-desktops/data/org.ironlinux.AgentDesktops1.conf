<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; anyone may call it. Every method is then
     authorised individually through polkit and agent ownership. -->
<busconfig>
  <policy user="root">
    <allow own="org.ironlinux.AgentDesktops1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ironlinux.AgentDesktops1"/>
    <allow receive_sender="org.ironlinux.AgentDesktops1"/>
  </policy>
</busconfig>
